<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>XLSX Block — tabbed mode</title>
<style>
:root {
    color-scheme: dark;
    --background-primary: #1e1e1e;
    --background-secondary: #252525;
    --background-modifier-hover: #2a2a2a;
    --background-modifier-border: #333;
    --text-normal: #dcddde;
    --text-muted: #999;
    --text-accent: #7cb9e8;
}
body { margin: 0; padding: 24px; background: #181818; color: var(--text-normal); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
.note { max-width: 920px; }
pre { background: var(--background-secondary); padding: 8px; border-radius: 4px; font-size: 12px; overflow-x: auto; }
.spreadsheet-block { border: 1px solid var(--background-modifier-border); border-radius: 4px; margin: 1em 0; }
.spreadsheet-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 12px; background-color: var(--background-secondary); border-bottom: 1px solid var(--background-modifier-border); font-size: 0.85em; }
.spreadsheet-label { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }
.spreadsheet-actions { display: inline-flex; align-items: center; gap: 14px; flex: 0 0 auto; }
.spreadsheet-open { color: var(--text-accent); text-decoration: none; cursor: pointer; }
.spreadsheet-load-all { color: var(--text-muted); text-decoration: none; cursor: pointer; font-size: 0.9em; }
.spreadsheet-tabbar { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px 4px 0 4px; background-color: var(--background-secondary); border-bottom: 1px solid var(--background-modifier-border); }
.spreadsheet-tab { appearance: none; background: var(--background-primary); border: 1px solid var(--background-modifier-border); border-bottom: none; border-radius: 4px 4px 0 0; padding: 4px 10px; font-size: 0.85em; cursor: pointer; color: var(--text-muted); }
.spreadsheet-tab-active { background: var(--background-primary); color: var(--text-normal); font-weight: 600; border-bottom: 1px solid var(--background-primary); position: relative; top: 1px; }
.spreadsheet-subtoolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 12px; background-color: var(--background-modifier-border-hover); border-top: 1px solid var(--background-modifier-border); font-size: 0.85em; }
.spreadsheet-scroll { overflow-x: auto; }
.spreadsheet-table { border-collapse: collapse; margin: 0; width: 100%; }
.spreadsheet-table th, .spreadsheet-table td { border: 1px solid var(--background-modifier-border); padding: 6px 13px; white-space: nowrap; }
.spreadsheet-table th { position: sticky; top: 0; background-color: var(--background-modifier-hover); z-index: 1; font-weight: bold; }
.spreadsheet-table tr:nth-child(2n) td { background-color: var(--background-secondary); }
.spreadsheet-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 12px; background-color: var(--background-secondary); border-top: 1px solid var(--background-modifier-border); font-size: 0.85em; }
.spreadsheet-footer a { color: var(--text-accent); text-decoration: none; cursor: pointer; margin-left: 12px; }
h3 { color: var(--text-normal); font-size: 14px; margin: 0 0 8px 0; font-weight: 600; }
</style>
</head>
<body>
<div class="note">
<h3>Quarterly budget — tabbed</h3>
<pre>```spreadsheet
Budget Q3.xlsx(Q1!A1:D8, Q2!A1:D8, Q3!A1:D8; mode=tabbed)
```</pre>

<div class="spreadsheet-block">
    <div class="spreadsheet-toolbar">
        <span class="spreadsheet-label">Budget Q3.xlsx</span>
        <span class="spreadsheet-actions">
            <a class="spreadsheet-load-all">Load all sheets</a>
            <a class="spreadsheet-open">Open in Excel</a>
        </span>
    </div>

    <div class="spreadsheet-tabbar">
        <button class="spreadsheet-tab spreadsheet-tab-active">Q1 · A1:D8</button>
        <button class="spreadsheet-tab">Q2 · A1:D8</button>
        <button class="spreadsheet-tab">Q3 · A1:D8</button>
    </div>

    <div class="spreadsheet-subblock">
        <div class="spreadsheet-subtoolbar">
            <span class="spreadsheet-label">Q1 · A1:D8</span>
        </div>
        <div class="spreadsheet-scroll">
            <table class="spreadsheet-table">
                <thead><tr><th>Category</th><th>Planned</th><th>Actual</th><th>Δ</th></tr></thead>
                <tbody>
                    <tr><td>Hosting</td><td>€420</td><td>€398</td><td>-€22</td></tr>
                    <tr><td>SaaS</td><td>€180</td><td>€195</td><td>+€15</td></tr>
                    <tr><td>Domains</td><td>€45</td><td>€42</td><td>-€3</td></tr>
                    <tr><td>Contractors</td><td>€1,200</td><td>€1,350</td><td>+€150</td></tr>
                </tbody>
            </table>
        </div>
        <div class="spreadsheet-footer">
            <span class="spreadsheet-label">Range A1:D8</span>
            <span><a>Refresh</a><a>Use full range</a></span>
        </div>
    </div>
</div>
</div>
</body>
</html>
